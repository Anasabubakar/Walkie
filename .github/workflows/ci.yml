name: Walkie CI & Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Android Pilot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Rust unit and integration tests
        run: cargo test --manifest-path rust/walkie-core/Cargo.toml

      - name: Run Jest test suite
        run: npm test

      - name: Generate Android native project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Cross-compile Rust core for Android
        run: |
          cd rust/walkie-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../../android/app/src/main/jniLibs build --release
          cd ../..
          mkdir -p android/app/src/main/res/drawable
          cp modules/expo-walkie-core/android/src/main/res/drawable/ic_stat_walkie.xml android/app/src/main/res/drawable/

      - name: Generate embedded JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Pilot APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Pilot APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkie-pilot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
