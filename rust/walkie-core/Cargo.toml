[package]
name = "walkie-core"
version = "0.1.0"
edition = "2021"
authors = ["Anas Abubakar <anasabubakar7000@gmail.com>"]
license = "MIT"
description = "High-performance zero-WAN audio engine for Walkie"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
